# Streamlit Community Cloud > App settings > Secrets 에 붙여 넣습니다.
# 12개 API 서비스는 발급처별 인증키 4개만 사용합니다.
# 국회사무처 3개 API는 ASSEMBLY_KEY 하나를 공유합니다.
# 중앙선거관리위원회 2개 + 행정안전부 5개 API는 DATA_GO_KR_KEY 하나를 공유합니다.
# KOSIS와 VWorld는 각각 별도 키를 사용합니다.
# 실제 인증키는 GitHub에 올리지 말고 Streamlit Secrets에만 입력하세요.

[API_KEYS]
ASSEMBLY_KEY = "여기에_열린국회정보_인증키"
DATA_GO_KR_KEY = "여기에_공공데이터포털_개인인증키"
KOSIS_KEY = "여기에_KOSIS_인증키"
VWORLD_KEY = "여기에_VWorld_인증키"

[APP]
# VWorld에 등록한 실제 Streamlit 앱 도메인과 일치해야 합니다.
VWORLD_DOMAIN = "https://실제-배포-도메인"
